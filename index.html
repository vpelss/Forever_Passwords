<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Forever Passwords</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<link rel="manifest" href="./themanifest.json"> <link rel='stylesheet' href='https://cdn.simplecss.org/simple.css'><link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="rootComponent">

  <div_header>
    <center>
      <span id="menu_icon">
        <button type="button">&#x2261;</button>
      </span>
      <span id="x_icon" hidden>
        <button type="button">X</button>
      </span>
      &nbsp;&nbsp;&nbsp;
      <span>
        fPw : Password Calculator
      </span>
      <hr>
    </center>
  </div_header>

  <div_main_page id="main_page_component">
    <form>
      <div id="aliasWrapper">      
          <datalist id="dataList" autocomplete="off"></datalist>
          <input type="text" id="Alias" autocomplete="off" list="dataList" placeholder="Website or Alias eg: mysite.com , teams(work)">
     <button type="button" id="xDeleteAlias">X</button>
      </div>
      <div>
        <input id="Secret" type="text" autocomplete="off" placeholder="Secret: A secure word or phrase" title="Your Alias and this Secret generate a unique Answer.">
      </div>
      <div>
        <input id="Answer" type="text" placeholder="Answer: A unique PW based on the Alias + Secret" readonly title="This is your Answer to use.">
      </div>

      <div id="characterModificationsWrapper">
        <select id="character_modifications" title="Character Modifications">
          <option value="no_character_modifications" selected>No Character Replacements (default) </option>
          <option value="no_special_characters">No Special Characters</option>
          <option value="force_special_characters">Force Special Characters</option>
        </select>
        <button type="button" id="explainSpecialCharacters">?</button>
      </div>

      <div>
        <input id="AliasComment" placeholder="Comments for Alias eg:13 characters,no special char" title="This is a field for a comment for the current Alias. For example, some sites may have special password requirements.">
      </div>

      <div id="resizeWrapper">
        <label id="resizeLabel" for="resize">Answer Length&nbsp;&nbsp;&nbsp;</label>
        <select id="resize" name="resize" title="Select desired Answer length.">
          <option value="8">
            8
          </option>
          <option value="9">
            9
          </option>
          <option value="10">
            10
          </option>
          <option value="11">
            11
          </option>
          <option value="12">
            12
          </option>
          <option value="13">
            13
          </option>
          <option value="14">
            14
          </option>
          <option value="15">
            15
          </option>
          <option value="16">
            16
          </option>
          <option value="17">
            17
          </option>
          <option value="18">
            18
          </option>
          <option value="19">
            19
          </option>
          <option value="20">
            20
          </option>
          <option value="21">
            21
          </option>
          <option value="22">
            22
          </option>
          <option value="23">
            23
          </option>
          <option value="24">
            24
          </option>
          <option value="25">
            25
          </option>
          <option value="26">
            26
          </option>
          <option value="27">
            27
          </option>
          <option value="28" selected>
            28
          </option>
        </select>
      </div>

      <center>
        <div>
          <span>
            <button type="button" id="copyButton" title="Copies Answer to clipboard. Saves Alias and Comment to local cookie.">Copy / Save</button>
          </span>
          &nbsp;&nbsp;&nbsp;
          <span>
            <button type="button" id="clearReset" title="Clears Answer and Secret if any plus all settings to default. Saved Aliases are not changed. Clipboard set to 'cleared'.">Clear / Reset</button>
          </span>
        </div>

        <div>
          <input type="checkbox" id="clearTimer" value="" title=""> <label for="clearTimer">Timed Clear</label>
        </div>
      </center>

    </form>
    <div id="timerAlert"></div>
  </div_main_page>

  <div_menu_page id="menu_page_component" hidden>
    <form>
      <center>
        <div>
          <button type="button" id="getAliasList">Get Alias List</button>
        </div>
        <div>
          <button type="button" id="saveAliasList">Save Alias List</button>
        </div>
        <div>
          <button type="button" id="exportAll">Export Alias List to Clipboard</button>
        </div>
        <div>
          <textarea id="JSONSave" rows="3" cols="50" placeholder="Import/Export/Backup Alias List. Save the text generated in a safe location." title="You can import/export your current Alias list (which is saved in the local cookie). This is helful to move it to another computer or use it as a backup.">
</textarea>
        </div>
      </center>
    </form>
    <center>    
      <div>Import / Export encrypted JSON database : using file</div>
      <div>
        <label for="fileInput" class="button">Import From File</label>
        <input type="file" id="fileInput" name="fileInput" class="button"/>
      </div>
      <div>
        <a download="WebsiteList.txt" id="fileOutput" class="button">Export To File</a>
      </div>
      <div>
        <button id="installPWA">Install as PWA</button>
      </div>
      <div>
        Links below will open in your default browser.
      </div>
      <div>
        <a href="https://vpelss.github.io/Forever_Passwords//README.md" target="_blank" class="button">Help/Read Me</a>
      </div>
      <div>
        <a href="https://github.com/vpelss/Forever_Passwords" target="_blank" class="button">Github</a>
      </div>
      <div>
        <a href="https://vpelss.github.io/Forever_Passwords/Licence.txt" target="_blank" class="button">Licence</a>
      </div>
      <div>
        <a href="https://www.emogic.com/cgi/fp/backup.php" target="blank" class="button">Doesn't work?</a>
      </div>
    </center>
  </div_menu_page>

  <div id="error"></div>

</div>

<dialog id="tempDialog">
</dialog>
    <script  src="./script.js"></script>

  </body>
  
</html>
